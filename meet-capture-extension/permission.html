<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notario — Enable Microphone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7F7F5; color: #0D0D0F;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      max-width: 440px; background: #fff; border-radius: 20px;
      padding: 40px; text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .emoji { font-size: 48px; margin-bottom: 16px; }
    .title { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    .body { font-size: 15px; color: #6B7280; line-height: 1.5; margin-bottom: 24px; }
    .status { font-size: 15px; font-weight: 600; margin-top: 8px; min-height: 22px; }
    .status.ok { color: #22C55E; }
    .status.err { color: #DC2626; }
    .btn {
      padding: 12px 28px; border-radius: 12px; border: none;
      font-size: 15px; font-weight: 600; cursor: pointer;
      background: #7FA8FF; color: #fff;
    }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎤</div>
    <p class="title">Enable Microphone</p>
    <p class="body">
      To capture your own voice in meetings, Notario needs microphone access.
      Click below and choose <b>Allow</b> when Chrome asks.
    </p>
    <button id="grant-btn" class="btn">Allow Microphone</button>
    <p class="status" id="status"></p>
  </div>
  <script src="permission.js"></script>
</body>
</html>
